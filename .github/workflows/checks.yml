name: Code Quality Checks

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  standard:
    uses: msstc4symfony/bundle-standard/.github/workflows/php-bundle.yml@v4.0.0
    with:
      # A plain PHP library: no Symfony version to test against (the checks are named "Symfony none").
      symfony-versions: '[{"version":"none","label":"none"}]'
      # Measured covered MSI 96 % on 2026-10-22 UTC (3 equivalent mutants), minus a margin for noise.
      infection-min-msi: 90
      infection-min-covered-msi: 90
